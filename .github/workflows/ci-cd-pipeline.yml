
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test

  deploy-simulado:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar simulacao
        run: echo "Iniciando deploy simulado..."

      - name: Simular publicacao
        run: echo "Aplicacao publicada no ambiente de simulacao!"

      - name: Finalizar
        run: echo "Deploy simulado concluido com sucesso!"
